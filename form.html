<DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" coontent="width=device-width,initial-scale=1">
<title>表单</title>
</head>
<body>
    <h3>登陆表单</h3>
    <form action="" method="post">
        <p>
            用户名：<input type="text" name="user">
        </p>
        <p>
            密&nbsp; 码：<input type="password" name="password" id="">
        </p>
        <input type="submit" value="登录">
        <input type="reset" value="重新输入">
    </form>
    <h3>表单关联-复选框</h3>
    <form action="" method="post">
        <p>
            用户名：<input type="text" name="user">
        </p>
        <p>
            密&nbsp; 码：<input type="password" name="password" id="">
        </p>
        <p>
            性别：<label><input type="radio" name="gender" value="m">男</label>
                  <label><input type="radio" name="gender" value="f">女</label>
                  <label><input type="radio" name="gender" value="n"checked>不告诉你</label>
        </p>
        <p>
            兴趣爱好：
            <label for="h1">登山</label><input type="checkbox" name="hobby" value="1" id="h1">
            <label for="h2">运动</label><input type="checkbox" name="hobby" value="2" id="h2">
            <label for="h3">唱歌</label><input type="checkbox" name="hobby" value="3" id="h3">
        </p>
    </form>
    <h3>下拉菜单</h3>
    <form action=""></form>
    <p>
        <selsect name="group" aria-multiline="0" id="">
            <option value="ji"></option>
            <option value=""></option>
        </selsect>
    </p>
    <button type="button">xuanzhewanbi</button>
</body>
</html>
