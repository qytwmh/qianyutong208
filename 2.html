<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型与运算符</title>
    <style>
        div{
            width: 180px;
            height: 180px;
            background-color: #651c96;
            margin: 10px;
            color: #4810e4;
            text-align: center;
            line-height: 100px;
            float: left;
        }

    </style>
</head>
<body>
    <script>
    var a = 6, b = 1;
    console.log(a + b);
    console.log(a++, ++b);
    console.log(a - b > 0 ? a : b);
    console.log(true && false, true || false, !true);

    var str = "hello world",
        num = 123,
        bl = true,
        obj = { name: "行三", age: 18 },
        ud,
        kong = null;

    console.log(typeof bl, typeof obj, typeof ud, typeof kong);
    console.log(0.1 + 0.2 == 0.3);
    // JS不能用 == 或者 === 来判断浮点数是否相等
    // 因为小数不能用二进制精确存储
    //数据类型转化；+号的时候将数字转化成字符串，-只能用于数值运算
    console.log(1+"1","1"-1,"11"+1-1);
    console.log("wangle"-1);
    //NAN
    console.log(isNaN(8));
    console.log(NaN == NaN,null==null);
    //isNaN() 用于判断一个值是否为NaN
    //parseInt() 是取整向下取整  
    console.log(parseInt(123,12));
    var num = 123;
    console.log(num==parseInt(num));
    //parseInt() 函数的第二个参数是进制数
    console.log(parseInt("100,16"));
    //1-100求和
    var num = 0;
    for(var i=1;i<=100;i++){
        num += i;
    }
    // 数7，（7的倍数，最大到99，个位是7，或者十位是7，不显示数字）
    for(var i=1;i<=99;i++){
        if(i%7==0 || i%10==7 || i/10==7){
            document.write("<div></div>");
        }
        else{
            document.write("<div>" + i + "</div>");
        }   
    }
    </script>
    
</body>
</html>
