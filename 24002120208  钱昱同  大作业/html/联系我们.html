<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 留言反馈表单</title>
    <link rel="stylesheet" href="../css/公共样式.css">
    <link rel="stylesheet" href="../css/联系我们.css">
</head>
<body>
    <header class="detail-header">
        <div class="logo">云章汉服</div>
        <nav>
            <ul>
                <li><a href="首页.html">首页</a></li>
                <li><a href="商品列表.html">锦裳市集</a></li>
                <li><a href="礼乐文库.html">礼乐文库</a></li>
                <li><a href="同胞社区.html">同袍雅集</a></li>
                <li><a href="形制详情.html">形制详情</a></li>
                <li><a href="联系我们.html">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <div class="marquee-box">
        <marquee>客服工作时间9:00-21:00｜订单问题、形制咨询、活动报名均可留言，24小时内回复</marquee>
    </div>

    <section class="page-fade contact-wrap">
        <h2 class="title-shadow">联系我们 · 在线留言反馈</h2>
        <div class="contact-grid">
            <!-- 功能区1：留言表单（全套表单元素，作业必做） -->
            <div class="form-box">
                <h3 class="sub-title">在线留言表单</h3>
                <form>
                    <div class="form-row">
                        <label>您的姓名</label>
                        <input type="text" placeholder="请输入真实姓名">
                    </div>
                    <div class="form-row">
                        <label>联系电话</label>
                        <input type="tel" placeholder="请输入手机号码">
                    </div>
                    <div class="form-row">
                        <label>咨询类型</label>
                        <select>
                            <option>请选择咨询分类</option>
                            <option>汉服商品购买咨询</option>
                            <option>形制考据科普提问</option>
                            <option>线下活动报名咨询</option>
                            <option>订单售后退换货</option>
                            <option>平台建议与反馈</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>用户身份</label>
                        <div class="radio-group">
                            <input type="radio" id="new" name="user-type">
                            <label for="new">新手同袍</label>
                            <input type="radio" id="old" name="user-type">
                            <label for="old">资深汉服爱好者</label>
                            <input type="radio" id="craft" name="user-type">
                            <label for="craft">手工匠人/设计师</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>详细留言内容</label>
                        <textarea rows="6" placeholder="请详细描述你的问题或建议..."></textarea>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn">提交留言</button>
                        <button type="reset" class="btn reset-btn">清空重填</button>
                    </div>
                </form>
            </div>

            <!-- 功能区2：店铺联系方式信息卡片 -->
            <div class="info-card">
                <h3 class="sub-title">平台联系方式</h3>
                <div class="info-item">
                    <h4>客服热线</h4>
                    <p>400-123-4567（9:00-21:00）</p>
                </div>
                <div class="info-item">
                    <h4>线下体验店地址</h4>
                    <p>XX市XX区国风文创街区18号云章汉服体验馆</p>
                </div>
                <div class="info-item">
                    <h4>合作邮箱</h4>
                    <p>cooperation@yunzhang-hanfu.com</p>
                </div>
                <div class="info-item">
                    <h4>平台服务时间</h4>
                    <p>全年无休，线上客服全天在线</p>
                </div>
                <a href="首页.html" class="btn" style="margin-top:20px;">返回首页浏览商城</a>
            </div>
        </div>
    </section>

    <footer>
        <p>云章汉服客服中心 | 所有页面互通跳转</p>
    </footer>
</body>
</html>
