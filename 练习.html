<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习</title>
    <style>
 a {
            text-decoration: none;
            color: #999;
        }
        img {
            display: block;
            border: none;
        }

        .news {
            width: 426px;
            margin-right: auto;
            margin-left: auto;
            border: 1px solid #c66;
            border-radius: 6px;
        }

        .top {
            height: 24px;
            line-height: 24px;
            padding-left: 22px;

        }
        .top h2 {
            color: #c66;
            letter-spacing: 2px;
            float: left;
            font-size: 14px;
        }
        .top_right {
            font-size: 12px;
            float: right;
            padding-right: 16px;
        }

        .content {
            padding: 2px 10px;
        }
        .set {
            margin-top: 3px;
            border-bottom: 1px dotted #ccc;
            margin-bottom: 2px;
            padding: 3px;
            height: 61px;
        }
        .set img {
            padding: 1px;
            float: left;
            margin-right: 10px;
            border: 1px solid #ccc;
        }
        .text_right {
            line-height: 19px;
            color: #f7f7f7;
            padding-right: 5px;
            padding-left: 5px;
            font-size: 12px;
        }
        .text_right h3 {
            font-weight: normal;
            color: #990;
            font-size: 12px;
        }
        .text_right p {
            line-height: 150%;
            color: #333;
            text-indent: 2em;
        }
        .last {
            border-bottom: none;
        }
</style>
</head>
<body>
<div class="news">
    <div class="top">
    <h2>甘日十年</h2>
    <div class="top_right">
    <a href="#">新闻</a>
    <a href="#">视频</a>
    <a href="#">论坛</a>
    <a href="#">主页</a>
    </div>
</div>
<div class="content">
    <div class="set"></div>
        <div class="list-top">红日初升：学院二十年宣传片</div>
        <div class="list-text_right">第一个二十年已悄然走过，让我们心态归零，突破自我，共同拼搏，为下一个辉煌的二十年而奋斗!</div>
</div>
<div class="content">
        <div class="list-top h2">奠基2.0:十年之前,十年之后</div>
        <div class="list-text_right h3">通过推进工程教育模式对人才培养质量进行一次全面升级，为新十年的发展奠基。</div>
</div>
<div class="content">
        <div class="list-top_right">新十年,在路上</div>
        <div class="list-text_right p">这十年的跨越，是对“教育创造学生价值“理念的朴素诠释，是源于创业精神的传承。</div>
</div>
</body>
</html>
