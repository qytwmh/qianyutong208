<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=deyice-width,initial-scale">
    <title>布局</title>
<style>
   #main{
        width: 940px;
        margin: 0px auto;
        background-color: aqua;
        border: 1px solid #011014;
    }
    #top {
        height: 50px;
        border-bottom: 1px solid black;
                }
    #left{  
        display: inline;
        float: left;
         width: 300px;
        margin: 10px;
                }
    .box1{
            height: 198px;
             width: 298px;
            border: 1px solid #00070b;
            background-color: aliceblue;
            margin:10px auto;
                }
    .box2 {
            width: 298px;
            height: 298px;
            border: 1px solid black;
             background-color: aliceblue;
            margin-top: 10px;
            margin-left: 10px;
            margin: auto;
            float: left;
            display: inline;
            }
    #right{      float: right;
                 width: 620px;
                 margin: 10px;
                 display: inline;
        
    }
    #footer{
        clear: both;
        height: 50px;
        border-top: 1px solid black;
    }
    h3{

    }
    .f{
        position: absolute;
        width: 500px;
        height: 400px;
        border: 2px double red;
    }
    .s{
        position: absolute;
        top: 50%;
        left: 50%;
    }
</style>
</head>
<body>
    <h3>双栏布局，先进行width的设计</h3>
    <div id="main">
        <div id="top"></div>
        <div id="right"></div>
        <div id="left">
            <div class="boxi"></div>
            <div class="boxi"></div>
            <div class="boxi"></div>
            <div class="box2"></div>
            <div class="box2"></div>
            <div class="box2"></div>
            <div class="box2"></div>
        </div>
    </div>
</body>
</html>
