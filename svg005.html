<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="https://at.alicdn.com/t/c/font_5231902_5wxwd0nwam6.js"></script>
    <link rel="stylesheet" href="./svg005.css">


</head>

<body>
    <h3>SVG图标</h3>
    <div class="tab-nav">
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-xz"></use>
            </svg>
            <span>首页</span>
            <!-- <1--div.budge-dot回车 -->
            <!-- <1--红点--></1-->
        <div class="budge-dot"></div>
        </div>


        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-gouwuche1"></use>
            </svg>
            <span>购物车</span>
            <!-- <1--数字红点--></1 -->
            <div class="budge-num",id="budge-plan">6</div>
        </div>
        <div class="tab-item"> 
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-wodedangxuan"></use>
            </svg>
            <span>我的</span>
            <div class="budge-border",id="budge-collect"></div>
        </div>
            <div class="tab-item">
                <svg class="icon" aria-hidden="true">
                    <use xlink:href="#icon-shouye"></use>
                </svg>
                <span>点赞</span>
                <div class="budge-num max",id="budge-my">100+</div>
            </div>
    </div>
            <script>
                // 写一个函数,当我点击当天的item时候,颜色发生变化//
                function changeTab(current) {
                    let tabs = document.querySelectorAll(".tab-item");
                    for (let i = 0; i < tabs.length; i++) {
                        tabs[i].classList.remove("active");
                    }
                    current.classList.add("active");
                }
            </script>
</body>

</html>
